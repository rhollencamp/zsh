<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>zsh</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="welcome" class="overlay">
      <form id="welcome-form" class="panel">
        <h1>zsh</h1>
        <label for="player-name">Username</label>
        <input
          id="player-name"
          required
          maxlength="24"
          autocomplete="nickname"
          autofocus
        />
        <p id="welcome-error" class="error" hidden></p>
        <div class="buttons">
          <button type="submit" data-mode="online">Play online</button>
          <button type="submit" data-mode="offline" class="secondary">
            Play offline
          </button>
        </div>
        <p class="hint">
          <span class="hint-keys">Move with WASD or the arrow keys.</span>
          <span class="hint-touch"
            >Drag on the left side of the screen to move.</span
          >
        </p>
        <p class="credits">
          Textures:
          <a href="https://github.com/Athemis/PixelPerfectionCE" target="_blank"
            >Pixel Perfection</a
          >
          by XSSheep &amp; contributors,
          <a
            href="https://creativecommons.org/licenses/by-sa/4.0/"
            target="_blank"
            >CC BY-SA 4.0</a
          >
        </p>
      </form>
    </div>
    <script type="module" src="./entry.ts"></script>
  </body>
</html>
